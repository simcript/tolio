# Template: merge these locations into the existing host server, preserving its
# other module locations. Replace hostname, certificate and PHP socket paths.
server {
    listen 443 ssl;
    server_name tools.example.com;
    root /srv/tools/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/tools.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.example.com/privkey.pem;
    client_max_body_size 16k;

    # Full invitation paths/query strings must never enter access logs.
    location ^~ /kalaqpar/join/ {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ^~ /kalaqpar/r/ {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ^~ /kalaqpar/api/ {
        access_log off;
        client_max_body_size 4k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    # Module assets are allowlisted and delivered by Pano, not a source alias.
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
